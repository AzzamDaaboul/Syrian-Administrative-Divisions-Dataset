<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Syria Administrative Divisions Map</title>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
    <style>
        body { margin: 0; padding: 0; }
        #map { height: 100vh; width: 100%; }
        .info-panel {
            padding: 10px;
            background: white;
            border-radius: 5px;
            box-shadow: 0 0 15px rgba(0,0,0,0.2);
        }
    </style>
</head>
<body>
    <div id="map"></div>
    
    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
    <script>
        // Initialize map centered on Syria
        const map = L.map('map').setView([35.0, 38.0], 7);
        
        // Add OpenStreetMap base layer
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
        }).addTo(map);
        
        // Load GeoJSON data
        fetch('syria_administrative_province_state_boundary.geojson')
            .then(response => response.json())
            .then(data => {
                // Add GeoJSON layer
                L.geoJSON(data, {
                    style: function(feature) {
                        return {
                            fillColor: getRandomColor(),
                            weight: 2,
                            opacity: 1,
                            color: 'white',
                            fillOpacity: 0.7
                        };
                    },
                    onEachFeature: function(feature, layer) {
                        // Bind popup with information
                        if (feature.properties) {
                            layer.bindPopup(`
                                <h3>${feature.properties.name} (${feature.properties.locname})</h3>
                                <p>Official Name: ${feature.properties.offname}</p>
                                <p>ISO Code: ${feature.properties.iso3166_2}</p>
                            `);
                        }
                    }
                }).addTo(map);
            });
        
        // Generate random colors for regions
        function getRandomColor() {
            const letters = '0123456789ABCDEF';
            let color = '#';
            for (let i = 0; i < 6; i++) {
                color += letters[Math.floor(Math.random() * 16)];
            }
            return color;
        }
    </script>
</body>
</html>
